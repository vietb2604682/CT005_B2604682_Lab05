<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab05 - Infographic và Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1, h2 {
            text-align: center;
            color: #174ea6;
        }

        .section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>Infographic và Video học tập</h1>

    <div class="section">
        <h2>1. Infographic</h2>
        <p>Hình ảnh infographic được tạo trong Nhiệm vụ 2.1.</p>

        <img src="Lab05_Ex2.1.png"
             alt="Infographic Lab05">
    </div>

    <div class="section">
        <h2>2. Video YouTube</h2>
        <p>Video minh họa nội dung thực hành Nhiệm vụ 2.2.</p>


<iframe
    src="https://www.youtube.com/embed/jAuHcn-GKZs"
    title="Video thực hành Nhiệm vụ 2.2"
    width="100%"
    height="450"
    allowfullscreen>
</iframe>


    <footer>
        © 2026 - Bản quyền thuộc về tác giả.
    </footer>
</body>
</html>
